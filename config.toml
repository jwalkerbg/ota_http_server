# config.toml

# Sample of parameters in the program
[parameters]
no_certs = true
port = 8071
www_dir = "www"
firmware_dir = "firmware"
url_firmware = "firmware"
jwt_issuer = "okto7-ota"
jwt_audience = "ota_api"
admin_activity_log = "admin_activity.log"
log_rotation_strategy = "hybrid"
log_rotation_max_bytes = 10485760
log_rotation_backup_count = 14
log_rotation_when = "midnight"
log_rotation_interval = 1

[logging]
verbose = 3
#version_option = true

[database]
dbtype = "sqlite"

[database.mysql]
dbhost = "localhost"
dbport = 3306
database = "ota_db"
dbuser = "ota_user"
dbpassword = "SlavaUkraini"

[database.sqlite]
db_file = "ota_db.sqlite"
